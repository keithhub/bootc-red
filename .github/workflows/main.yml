name: Build OS Image

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '11 17 * * 0'
  workflow_dispatch:

permissions:
  contents: read    # Default: only read until a job needs more

jobs:
  build-and-publish-image:
    name: Build and Publish Container Image
    runs-on: ubuntu-latest
    permissions:
      contents: read    # To checkout the repository
      packages: write   # To push container images to GHCR
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install buildah and podman
        run: |
          sudo apt-get update
          sudo apt-get install -y buildah podman

      - name: Log in to GitHub Container Registry (GHCR)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | buildah login -u "${{ github.actor }}" --password-stdin ghcr.io

      - name: Determine Image Name and Tags
        id: meta
        run: |
          # Construct the base image name. GHCR requires lowercase.
          IMAGE_OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO_NAME_LOWER=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_NAME="ghcr.io/${IMAGE_OWNER_LOWER}/${REPO_NAME_LOWER}"
          echo "image_name=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "Full image name with tags: ${IMAGE_NAME}:latest, ${IMAGE_NAME}:${{ github.sha }}"

      - name: Build image
        run: |
          IMAGE_NAME="${{ steps.meta.outputs.image_name }}:${{ github.sha }}" \
            ./build.sh

      - name: Tag and push
        run: |
          IMAGE_NAME="${{ steps.meta.outputs.image_name }}"
          buildah tag "${IMAGE_NAME}:${{ github.sha }}" "${IMAGE_NAME}:latest"
          buildah push "${IMAGE_NAME}:${{ github.sha }}"
          buildah push "${IMAGE_NAME}:latest"
