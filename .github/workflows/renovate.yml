name: Renovate

on:
  schedule:
    # Run several times a day so digest-only base image updates are not delayed long
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'renovate.json'
      - '.github/workflows/renovate.yml'

permissions:
  contents: read

jobs:
  renovate:
    name: Renovate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Verify GitHub App credentials are set
        env:
          RENOVATE_APP_CLIENT_ID: ${{ secrets.RENOVATE_APP_CLIENT_ID }}
          RENOVATE_APP_PRIVATE_KEY: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
        run: |
          missing=0
          if [ -z "$RENOVATE_APP_CLIENT_ID" ]; then
            echo '::error::RENOVATE_APP_CLIENT_ID is empty. Store the GitHub App Client ID as repository secret RENOVATE_APP_CLIENT_ID.'
            missing=1
          fi
          if [ -z "$RENOVATE_APP_PRIVATE_KEY" ]; then
            echo '::error::RENOVATE_APP_PRIVATE_KEY is empty. Store the GitHub App private key (.pem) as repository secret RENOVATE_APP_PRIVATE_KEY.'
            missing=1
          fi
          exit "$missing"

      # Exchange the GitHub App credentials for a short-lived installation token.
      # App tokens expire after ~1 hour, so mint one at the start of each run.
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}

      - name: Self-hosted Renovate
        uses: renovatebot/github-action@e09d604f8f803bb527bd8321ed5be06c460b8682 # v46.2.2
        with:
          token: ${{ steps.app-token.outputs.token }}
        env:
          LOG_LEVEL: info
          RENOVATE_PLATFORM: github
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_PLATFORM_COMMIT: enabled
