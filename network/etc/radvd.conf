# radvd configuration for Android compatibility
interface br0
{
    AdvSendAdvert on;

    # Android-friendly intervals for faster connectivity
    MinRtrAdvInterval 3;
    MaxRtrAdvInterval 10;

    # Explicit MTU for clarity
    AdvLinkMTU 1500;

    prefix ::/64
    {
        AdvRouterAddr on;
        AdvPreferredLifetime 1800;
        AdvValidLifetime 3600;
    };
};
